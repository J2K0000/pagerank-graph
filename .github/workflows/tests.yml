# Tests de l'outil à chaque modification de main et à chaque proposition de modification (pull request).
# Actions épinglées sur un commit exact (une étiquette de version peut être déplacée), droits en lecture seule.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Installer l'outil et les dépendances de test
        run: python -m pip install -e ".[test]"
      - name: Vérifier que la version installée est celle du code
        run: python -c "import importlib.metadata as m, prgraph; assert m.version('pagerank-graph') == prgraph.__version__"
      - name: Lancer les tests
        run: python -m pytest -q -p no:cacheprovider
