  // 7 · La carte des silos (SVG statique, disposition en anneau déterministe)
  function slideSilos(C) {

        var sa = C.segments[a], sb = C.segments[b];

    if (tot > 0) for (i = 0; i < n; i++) for (j = 0; j < n; j++) if (i !== j && F[i][j] / tot > 0.03) arrows.push({ a: i, b: j, share: F[i][j] / tot });
    arrows.sort(function (x, y) { return y.share - x.share; });
    arrows = arrows.slice(0, 14);

    var top = fams[0];
    var title = ['Les pages ', { em: famPhrase(top.name) }, ' captent ' + pctI(top.pr_share) + ' de l’autorité.'];
    var s = makeSlide(C, { rail: 'Où va l’autorité', eyebrow: 'La carte des silos', source: C.srcCrawl, title: title });

    // Géométrie déterministe : la rubrique la plus nourrie au centre, les autres sur une ellipse, espacées
    // à longueur d'arc égale, dans l'ordre de leur part d'autorité. Aire des cercles proportionnelle à la part.
    var VW = CW, VH = titleLines(title) > 1 ? 410 : 456, cx = VW / 2, cy = VH / 2;
    var maxS = num(top.pr_share) || 1, R0 = 76, rMin = 9;
    var Rx = 330, Ry = 158, ringN = n - 1;
    var samp = 720, pts = [], cum = [0], th, q;
    for (q = 0; q <= samp; q++) { th = Math.PI + 2 * Math.PI * q / samp; pts.push({ th: th, x: cx + Rx * Math.cos(th), y: cy + Ry * Math.sin(th) }); }
    for (q = 1; q <= samp; q++) cum.push(cum[q - 1] + Math.hypot(pts[q].x - pts[q - 1].x, pts[q].y - pts[q - 1].y));
    var perim = cum[samp];
    function atArc(frac) { var target = frac * perim, q2 = 0; while (q2 < samp && cum[q2 + 1] < target) q2++; return pts[q2]; }
    var P = fams.map(function (f, k) {
      var r = Math.max(rMin, R0 * Math.sqrt(num(f.pr_share) / maxS));
      if (k === 0) return { f: f, center: true, th: 0, x: cx, y: cy, r: r };
      var pt = atArc((k - 0.5) / ringN);
      return { f: f, center: false, th: pt.th, x: pt.x, y: pt.y, r: r };
    });
    if (n === 2) { P[0].x = cx - 220; P[1].x = cx + 220; P[1].y = cy; P[1].th = 0; P[0].center = false; P[0].th = Math.PI; }
    // Aucun chevauchement : réduire tous les rayons si deux cercles se touchent
    var shrink = 1;
    for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) {
      var dd = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y) - 26;
      if (P[i].r + P[j].r > dd && dd > 0) shrink = Math.min(shrink, dd / (P[i].r + P[j].r));
    }
    P.forEach(function (p) { p.r = Math.max(rMin, p.r * shrink); });

    var svg = sv('svg', { width: VW, height: VH, role: 'img', preserveAspectRatio: 'xMidYMid meet',
      'aria-label': 'Carte des rubriques : taille = part de l’autorité, flèches = flux de plus de 3 % entre rubriques' }, { 'font-family': 'var(--pr-sans)' });
    var gA = sv('g'), gC = sv('g'), gL = sv('g');
    svg.appendChild(gA); svg.appendChild(gC); svg.appendChild(gL);
    var bb = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    function grow(x0, y0, x1, y1) { bb.x0 = Math.min(bb.x0, x0); bb.y0 = Math.min(bb.y0, y0); bb.x1 = Math.max(bb.x1, x1); bb.y1 = Math.max(bb.y1, y1); }

    // Flèches (sous les cercles), épaisseur proportionnelle au flux. Centre et anneau : presque droites ;
    // anneau vers anneau : courbées vers l'extérieur pour contourner le centre. Les deux sens d'une paire
    // sont décalés de part et d'autre.
    var fmax = arrows.length ? arrows[0].share : 1;

        var ox = mx0 - cx, oy = my0 - cy, ol = Math.hypot(ox, oy);

      }

        { fill: 'none', stroke: col, 'stroke-width': r1(w) + 'px', 'stroke-linecap': 'butt', opacity: op });
      var poly = sv('path', { d: 'M' + r1(tipP.x) + ' ' + r1(tipP.y) + 'L' + r1(baseP.x - ey * hw) + ' ' + r1(baseP.y + ex * hw) +
        'L' + r1(baseP.x + ey * hw) + ' ' + r1(baseP.y - ex * hw) + 'Z' }, { fill: col, opacity: op });
      var label = famLabel(A.f.name) + ' vers ' + famLabel(B.f.name) + ' : ' + pctA(ar.share) + ' du flux';

      if (k === 0) {

        gL.appendChild(svText(mx, my + 4, pctA(ar.share), { 'text-anchor': 'middle' },
          { fill: INK, 'font-size': '13px', 'font-weight': '700', stroke: PAPER, 'stroke-width': '4px', 'paint-order': 'stroke', 'stroke-linejoin': 'round' }));
      }
    });

    // Cercles (anneau de 2 px couleur papier) et étiquettes directes ; le centre porte son étiquette à l'intérieur
    P.forEach(function (p) {
      var fill = famColor(p.f);

      tip(c, famLabel(p.f.name) + ' : ' + pctA(p.f.pr_share) + ' de l’autorité' + (isNum(p.f.pages) ? ', ' + nPages(p.f.pages) : ''));
      gC.appendChild(c);
      grow(p.x - p.r, p.y - p.r, p.x + p.r, p.y + p.r);

      Array.prototype.forEach.call(s.querySelectorAll('[data-ref]'), function (r) {
        var t = refs[r.getAttribute('data-ref')], k = t ? seq.indexOf(t) : -1;
        r.textContent = k >= 0 ? (r.getAttribute('data-pre') || '') + 'p. ' + (k + 1) + (r.getAttribute('data-post') || '') : '';
      });
    });
    return seq;
  }

  // ── Interface à l'écran : scène, commandes, clavier, balayage ──────────────
  function icon(d) {
    var g = sv('svg', { viewBox: '0 0 16 16', 'aria-hidden': 'true', focusable: 'false' });
    g.appendChild(sv('path', { d: d }, { fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    return g;
  }
  function button(label, shortLabel, d, onClick) {
    var b = el('button', 'pr-btn');
    b.type = 'button';
    b.setAttribute('aria-label', label);
    b.title = label;
    if (d) b.appendChild(icon(d));
    if (shortLabel) b.appendChild(el('span', 'pr-long', shortLabel));
    b.addEventListener('click', onClick);
    return b;
  }
  function buildUi() {
    root.setAttribute('role', 'region');
    var stage = el('div', 'pr-stage'), frame = el('div', 'pr-frame'), deck = el('div', 'pr-deck');
    frame.appendChild(deck); stage.appendChild(frame);
    state.slides = buildSlides();
    state.slides.forEach(function (s) { deck.appendChild(s); });
    var bar = el('div', 'pr-bar');
    state.prev = button('Diapositive précédente', 'Précédente', 'M10 3L5 8l5 5', function () { go(state.current - 1, true); });
    state.next = button('Diapositive suivante', 'Suivante', 'M6 3l5 5-5 5', function () { go(state.current + 1, true); });
    state.counter = el('div', 'pr-count');
    state.counter.setAttribute('aria-live', 'polite');
    var pdf = button('Exporter en PDF', 'Exporter en PDF', 'M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10', function () { window.print(); });
    var back = button('Retour à l’analyse', 'Retour à l’analyse', 'M6.5 4L2.5 8l4 4M3 8h10', exitToAnalyse);
    add(bar, state.prev, state.counter, state.next, el('div', 'pr-spacer'), pdf, back);
    root.replaceChildren(stage, bar);
    state.stage = stage; state.frame = frame; state.deck = deck;
    // Balayage horizontal sur écran tactile
    stage.addEventListener('pointerdown', function (e) { state.pointer = { x: e.clientX, y: e.clientY }; });
    stage.addEventListener('pointerup', function (e) {
      var p = state.pointer; state.pointer = null;
      if (!p) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(state.current + (dx < 0 ? 1 : -1), true);
    });
    stage.addEventListener('pointercancel', function () { state.pointer = null; });
    state.built = true;
  }
  function fit() {
    if (!state.open || !state.stage) return;
    var w = state.stage.clientWidth, h = state.stage.clientHeight;
    var pad = w < 600 ? 16 : 28;
    var k = Math.max(0.05, Math.min((w - 2 * pad) / SW, (h - 2 * pad) / SH));
    state.frame.style.width = Math.floor(SW * k) + 'px';
    state.frame.style.height = Math.floor(SH * k) + 'px';
    state.deck.style.transform = 'scale(' + k + ')';
  }
  function go(i, focus) {
    var n = state.slides.length;
    if (!n) return;
    i = Math.max(0, Math.min(n - 1, i));
    state.slides.forEach(function (s, k) {
      var on = k === i;
      s.classList.toggle('is-current', on);
      if (on) s.removeAttribute('aria-hidden'); else s.setAttribute('aria-hidden', 'true');
    });
    state.current = i;
    state.counter.textContent = (i + 1) + ' / ' + n;
    state.prev.disabled = i === 0;
    state.next.disabled = i === n - 1;
    if (focus) { try { state.slides[i].focus({ preventScroll: true }); } catch (e) { state.slides[i].focus(); } }
  }
  function exitToAnalyse() {
    var P = window.PRGRAPH;
    if (P && typeof P.setMode === 'function') P.setMode('analyse');
    else close();
  }
  function onKey(e) {
    if (!state.open || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName ? t.tagName.toLowerCase() : '';
    var onControl = tag === 'button' || tag === 'input' || tag === 'select' || tag === 'textarea' || (t && t.isContentEditable);
    var k = e.key;
    if (k === 'Escape' || k === 'Esc') { e.preventDefault(); exitToAnalyse(); return; }
    if (onControl && (k === ' ' || k === 'Spacebar' || k === 'Enter')) return;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || ((k === ' ' || k === 'Spacebar') && !e.shiftKey)) { e.preventDefault(); go(state.current + 1, true); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || ((k === ' ' || k === 'Spacebar') && e.shiftKey)) { e.preventDefault(); go(state.current - 1, true); }
    else if (k === 'Home') { e.preventDefault(); go(0, true); }
    else if (k === 'End') { e.preventDefault(); go(state.slides.length - 1, true); }
  }

  // ── API publique ──────────────────────────────────────────────────────────
  function open() {
    if (!state.built) buildUi();
    // Le mode Analyse pose data-mode ; à défaut (page autonome), la présentation le pose et le retire à la fermeture
    if (document.body && !document.body.hasAttribute('data-mode')) { document.body.setAttribute('data-mode', 'presentation'); state.modeSetByMe = true; }
    root.hidden = false;
    state.open = true;
    fit();
    go(state.current, true);
  }
  function close() {
    root.hidden = true;
    state.open = false;
    if (state.modeSetByMe && document.body) { document.body.removeAttribute('data-mode'); state.modeSetByMe = false; }
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  window.PRGRAPH_PRESENT = { open: open, close: close };
})();
</script>
